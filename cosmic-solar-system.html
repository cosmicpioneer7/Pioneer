<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Cosmic Solar System</title>

<style>

html,body{height:100%;margin:0;overflow:hidden;color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;background:radial-gradient(ellipse at 20% 15%,#1b1240 0,transparent 55%),radial-gradient(ellipse at 85% 85%,#07304a 0,transparent 50%),#01020a}

#card p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:#c9cdee}
#st{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}

#dock{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px}

button.on{border-color:var(--ac);color:var(--ac)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

.lab{position:fixed;left:0;top:0;font-size:11px;letter-spacing:.14em;color:#dfe3ff;pointer-events:none;text-shadow:0 0 6px #000;will-change:transform}
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;transition:height 1.4s ease;pointer-events:none}.lb.t{top:0}.lb.b{bottom:0}body.tour .lb{height:8vh}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.6s ease,visibility 1.6s;background:radial-gradient(ellipse at center,rgba(1,2,10,.74),rgba(1,2,10,.92));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}

body.cine .ui{opacity:0;pointer-events:none;transition:opacity .6s}
#dock{transition:opacity .5s}
.row{position:relative}.row>:first-child{margin-left:auto}.row>:last-child{margin-right:auto}

.pri{border-color:var(--ac);color:#1a1000;background:var(--ac);font-weight:700}

@media(min-width:900px){#brand{left:28px;top:calc(env(safe-area-inset-top,0px) + 22px);font-size:15px}#sim{right:28px;top:calc(env(safe-area-inset-top,0px) + 22px);font-size:13px}#card{left:28px;top:calc(env(safe-area-inset-top,0px) + 60px);max-width:360px}}
#intro{justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + clamp(24px,8vh,90px)) 24px 24px;background:linear-gradient(to bottom,rgba(1,2,10,.95) 0,rgba(1,2,10,.86) 42%,rgba(1,2,10,0) 74%);backdrop-filter:none;-webkit-backdrop-filter:none}
#intro h1{animation:rise 1.4s ease both}#intro p{margin:14px 0 22px;animation:rise 1.4s ease .3s both}#intro button{animation:rise 1.4s ease .6s both}
